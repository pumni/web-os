name: Behavioral Evals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.agents/evals/**'
      - 'scripts/run-behavioral-evals.mjs'
      - 'AGENTS.md'

jobs:
  stub-pipeline:
    name: Behavioral pipeline (stub, deterministic)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Runner self-test (scoring + extract + parse)
        run: bun run scripts/run-behavioral-evals.mjs -- --self-test

      - name: End-to-end with stub agent (deterministic)
        run: bun run scripts/run-behavioral-evals.mjs
        env:
          BEHAVIORAL_EVAL_AGENT: 'node scripts/eval-stub-agent.mjs'

  behavioral:
    name: Run Behavioral Evals (Gemini)
    runs-on: ubuntu-latest
    if: ${{ secrets.LLM_API_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Behavioral Evals
        run: bun run scripts/run-behavioral-evals.mjs
        env:
          BEHAVIORAL_EVAL_AGENT: 'node scripts/eval-agent.mjs'
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
