name: Docs Health

# Scheduled documentation link-rot check. Scans external URLs in documentation
# to surface broken links that rot over time.

on:
  schedule:
    # 06:00 UTC every Monday.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-health
  cancel-in-progress: false

jobs:
  docs-health:
    name: Docs health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: External link check (Lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-mail
            --max-concurrency 16
            'AGENTS.md'
            'apps/web/AGENTS.md'
            'packages/*/AGENTS.md'
            'docs/**/*.md'
            '.agents/**/*.md'
            '.claude/rules/*.md'
            'README.md'
          fail: true
