name: Docs Health

# Nightly documentation health check. Runs the deterministic AI-context gate on
# a schedule (not only on PR) so staleness, graph drift, and link rot surface
# even when no one is actively editing docs. Also scans external links with
# Lychee — internal links are already covered by `bun run ai:check` on every
# push/PR; this adds coverage for https:// links that rot silently.
#
# Manual trigger is available for on-demand runs after bulk doc edits.

on:
  schedule:
    # 06:00 UTC every Monday.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-health
  cancel-in-progress: false

jobs:
  docs-health:
    name: Docs health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so ai-metrics can score ADR adoption across recent commits.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: AI context check (structure + graph sync + freshness)
        run: bun run ai:check

      - name: AI static review gate
        run: bun run ai:review

      - name: AI context metrics snapshot
        # Advisory only — never fails the job. The JSON artifact is how trends
        # are compared across weekly runs.
        run: bun run ai:metrics -- --json > ai-metrics-snapshot.json

      - name: Upload metrics snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ai-metrics-${{ github.run_id }}
          path: ai-metrics-snapshot.json
          retention-days: 90

      - name: External link check (Lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          # Scan the instruction + docs surface only (not node_modules / generated).
          args: >-
            --no-progress
            --exclude-mail
            --max-concurrency 16
            'AGENTS.md'
            'apps/web/AGENTS.md'
            'packages/*/AGENTS.md'
            'docs/**/*.md'
            '.agents/**/*.md'
            '.claude/rules/*.md'
            'README.md'
          fail: true
