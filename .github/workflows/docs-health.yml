name: Docs Health

# Scheduled documentation link-rot check. Scans external URLs in documentation
# to surface broken links that rot over time.

on:
  schedule:
    # 06:00 UTC every Monday.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-health
  cancel-in-progress: false

jobs:
  docs-health:
    name: Docs health
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: External link check (Lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --exclude-mail
            --max-concurrency 16
            'AGENTS.md'
            'apps/web/AGENTS.md'
            'packages/*/AGENTS.md'
            'docs/**/*.md'
            '.agents/**/*.md'
            '.claude/skills/**/*.md'
            'README.md'
          fail: true
