name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .turbo
            apps/web/.next/cache
          key: ${{ runner.os }}-web-os-${{ hashFiles('bun.lock') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx', '**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-web-os-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fallow code quality audit
        # gate: new-only (set in .fallowrc.json audit.gate) — only new findings block CI.
        # --format compact: stable parseable output in v3.3.0.
        run: bun run fallow:audit --format compact --quiet

      - name: Fallow health score
        # Advisory — always exits 0; surfaces complexity hotspots in CI log.
        run: bun run fallow:health --format compact --quiet
        continue-on-error: true

      - name: Verify
        run: bun run verify
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://xtvuzvvqhbuldnaznfnq.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy-secret
